name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Nitro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro
          path: Nitro.apk

      - name: Als neueste Version veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste --yes --cleanup-tag || true
          gh release create "v${{ github.run_number }}" Nitro.apk \
            --title "Nitro 0.${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}" \
            --latest
